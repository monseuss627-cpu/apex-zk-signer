version: '3.8'
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  vertbacon:
    build: .
    ports:
      - "8000:8000"
      - "8099:8099"
    environment:
      - CODEWORDS_API_KEY=your_api_key
      - CODEWORDS_RUNTIME_URI=redis://redis:6379
      - SIGNER_SECRET=vertbacon-prod-signer-2026
      - APEX_API_BASE=https://omni.apex.exchange
      - SIGNER_URL=http://localhost:8099
      - LOGLEVEL=INFO
    depends_on:
      - redis
    restart: unless-stopped