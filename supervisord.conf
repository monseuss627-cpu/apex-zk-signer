[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:bot]
command=uvicorn vertbacon_api:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT="8000",LOGLEVEL="INFO",CODEWORDS_API_KEY="%(ENV_CODEWORDS_API_KEY)s",CODEWORDS_RUNTIME_URI="%(ENV_CODEWORDS_RUNTIME_URI)s",SIGNER_URL="%(ENV_SIGNER_URL)s"

[program:signer]
command=uvicorn signer_service:app --host 0.0.0.0 --port 8099
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT="8099",SIGNER_SECRET="%(ENV_SIGNER_SECRET)s",APEX_API_BASE="%(ENV_APEX_API_BASE)s"